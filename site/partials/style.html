<style>
:root{
  --bg:#0a0a0b; --bg2:#000;
  --card:#131316; --card2:#18181c; --card3:#1e1e23;
  --line:#26262c; --line2:#33333a;
  --txt:#fafafa; --mut:#9d9da8; --dim:#6b6b76;
  --blue:#0b84fe; --blue-d:#0668d4;
  --tp:#00b67a;
  --green:#1db954; --red:#f23645;
  --r:12px; --r-lg:16px;
  --w:1180px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,5.6vw,4.15rem)}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem)}
h3{font-size:1.1rem;font-weight:700}
.wrap{width:min(100% - 40px,var(--w));margin-inline:auto}
.sec{padding:clamp(56px,8vw,104px) 0}
.sec-t{text-align:center;max-width:680px;margin:0 auto clamp(32px,5vw,52px)}
.sec-t p{color:var(--mut);margin-top:12px;font-size:.95rem}
.kicker{display:inline-block;font-size:.78rem;font-weight:600;color:var(--mut);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;margin-bottom:18px;background:var(--card)}
.mut{color:var(--mut)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;border-radius:99px;padding:11px 22px;transition:.18s;white-space:nowrap}
.btn-b{background:var(--blue);color:#fff}
.btn-b:hover{background:var(--blue-d)}
.btn-w{background:#fff;color:#0a0a0b}
.btn-w:hover{background:#e8e8ec}
.btn-o{border:1px solid var(--line2);color:var(--txt)}
.btn-o:hover{border-color:#4a4a53;background:var(--card)}
.btn-sm{padding:8px 16px;font-size:.84rem}


/* ---------- ICONS ---------- */
.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px;flex:none}
.i.f{fill:currentColor;stroke:none}
.i.s12{width:12px;height:12px;vertical-align:-2px}
.i.s14{width:14px;height:14px;vertical-align:-2.5px}
.i.s18{width:18px;height:18px}
.i.s20{width:20px;height:20px}
.cc{display:inline-grid;place-items:center;min-width:24px;height:17px;padding:0 4px;border:1px solid var(--line2);border-radius:4px;background:var(--card3);font-size:.56rem;font-weight:700;letter-spacing:.05em;color:#c9c9d2;vertical-align:-2px}
.tp-st .i,.rv-st .i{width:11px;height:11px;vertical-align:0}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:26px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.08rem;letter-spacing:-.02em}
.lg-mk{width:26px;height:26px;border-radius:7px;background:var(--blue);display:grid;place-items:center;font-size:.66rem;font-weight:800;color:#fff}
.nv-l{display:flex;gap:4px;font-size:.87rem;color:var(--mut);font-weight:500}
.nv-l a{padding:8px 11px;border-radius:8px;transition:.15s}
.nv-l a:hover{color:var(--txt);background:var(--card)}
.nv-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.nv-lang{font-size:.82rem;color:var(--mut);display:flex;align-items:center;gap:6px;padding:8px 10px}
.burger{display:none;width:38px;height:38px;border:1px solid var(--line2);border-radius:9px;place-items:center;margin-left:auto}
.burger span{display:block;width:15px;height:1.6px;background:#fff;position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:15px;height:1.6px;background:#fff}
.burger span::before{top:-5px}.burger span::after{top:5px}
.mmenu{display:none;flex-direction:column;padding:8px 0 18px;border-top:1px solid var(--line)}
.mmenu.open{display:flex}
.mmenu a{padding:11px 4px;color:var(--mut);font-size:.92rem;border-bottom:1px solid #1a1a1f}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:clamp(58px,8vw,96px) 0 clamp(40px,5vw,64px);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:900px;height:560px;background:radial-gradient(50% 55% at 50% 20%,rgba(47,107,225,.22),rgba(11,132,254,.06) 55%,transparent 78%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero .kicker b{color:var(--blue);font-weight:700}
.hero h1{max-width:820px;margin:0 auto}
.hero .sub{color:var(--mut);margin:18px auto 26px;max-width:520px;font-size:1rem}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tp-line{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:26px;font-size:.86rem;flex-wrap:wrap}
.tp-line b{font-weight:700}
.tp-st{display:inline-flex;gap:2px}
.tp-st i{width:17px;height:17px;background:var(--tp);display:grid;place-items:center;font-style:normal;font-size:.6rem;color:#fff}
.tp-lg{color:var(--tp);font-weight:700;font-size:.86rem}
.tp-line a{text-decoration:underline;color:var(--mut)}
.hero-badges{display:flex;justify-content:center;gap:26px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
.hero-badges span{display:flex;align-items:center;gap:8px}
.ck{color:var(--blue);font-weight:700}
.press{display:flex;gap:28px;align-items:center;justify-content:center;margin-top:26px;flex-wrap:wrap}
.press b{font-family:Georgia,serif;font-size:1.25rem;color:#8b8b95;font-weight:700;letter-spacing:-.01em}
.press small{font-size:.62rem;line-height:1.25;color:#6b6b76;text-align:left;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* ---------- WHY BANNER ---------- */
.pills{display:flex;gap:8px;margin-top:4px}
.pl{font-size:.68rem;border:1px solid var(--line2);border-radius:99px;padding:4px 10px;color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.feat4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.f4{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 22px;position:relative;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.f4::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fa),transparent);opacity:0;transition:.18s}
.f4:hover{border-color:var(--line2);transform:translateY(-3px)}
.f4:hover::before{opacity:1}
.f4m{margin-top:auto;padding-top:16px;font-style:normal;font-size:.7rem;font-weight:800;color:var(--fa);letter-spacing:.03em}
.f4 .ic{width:42px;height:42px;border-radius:12px;background:var(--fa);color:#fff;display:grid;place-items:center;margin-bottom:14px;box-shadow:0 6px 16px color-mix(in srgb,var(--fa) 40%,transparent)}
.f4 h3{font-size:.95rem;margin-bottom:5px}
.f4 p{color:var(--mut);font-size:.82rem}



/* ---------- ABOOK BANNER ---------- */
.flex-bn{display:flex;align-items:center;border-radius:24px;position:relative;background:radial-gradient(95% 130% at 80% 0%,#f5f9fc 0%,#c4eefd 45%,#69c5fd 100%);min-height:clamp(340px,34vw,470px);padding:clamp(28px,5vw,64px);overflow:hidden;transition:.2s;border:1px solid rgba(18,50,94,.12)}
.flex-bn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(0deg,#91d3fc,transparent)}
.fb-one{position:absolute;right:6%;top:50%;transform:translateY(-52%);height:84%;width:auto;z-index:1;filter:drop-shadow(0 34px 44px rgba(23,82,160,.35))}
.flex-bn:hover{transform:translateY(-2px);box-shadow:0 24px 60px rgba(20,80,180,.18)}
.fb-t{max-width:58%;position:relative;z-index:2}
.fb-eye{display:block;font-size:.7rem;font-weight:700;letter-spacing:.4em;color:#1e5aa8;margin-bottom:16px}
.fb-t h2{color:#0e2a52;font-size:clamp(1.6rem,3.6vw,2.7rem);line-height:1.12;letter-spacing:-.02em}
.fb-t p{color:#2a4a77;font-size:.95rem;margin-top:14px;max-width:48ch}
.fb-btns{display:flex;gap:12px;margin-top:26px;align-items:center;flex-wrap:wrap}
.fb-dark{background:#12325e;color:#fff}
.fb-dark:hover{background:#0e2a52}
.fb-chip{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.78);border:1px solid rgba(18,50,94,.16);color:#12325e;font-weight:700;border-radius:99px;padding:11px 18px;font-size:.8rem;backdrop-filter:blur(4px)}
@media(max-width:820px){.fb-t{max-width:100%}.fb-one{height:72%;right:-14%;opacity:.5}}
/* ---------- WHY PANEL ---------- */
.why-panel{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,3vw,44px);align-items:center;border:1px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(85% 120% at 12% 0%,#12192a 0%,#101014 45%,#0f0f12 100%);padding:clamp(26px,3.6vw,48px);position:relative;overflow:hidden;margin-bottom:12px}
.why-panel::after{content:"";position:absolute;right:-140px;top:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(29,185,84,.1),transparent 65%)}
.wp-l{display:flex;flex-direction:column;position:relative;z-index:1}
.wp-l h3{font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.12;margin-bottom:12px}
.wp-l>p{color:var(--mut);font-size:.94rem;max-width:46ch}
.wp-pts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.wp-pts span{display:flex;gap:9px;align-items:center;font-size:.86rem;color:#d6d6de;font-weight:600}
.wp-pts .i{color:#39d573}
.wp-stats{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center}
.wp-stats>div{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:22px 4px;border-top:1px solid #202027}
.wp-stats>div:first-child{border-top:0}
.wp-stats b{font-family:"Plus Jakarta Sans";font-weight:800;font-size:clamp(1.9rem,3.4vw,2.6rem);letter-spacing:-.02em;line-height:1;white-space:nowrap}
.wp-stats span{font-size:.86rem;color:var(--mut);text-align:right}
.grn{color:#39d573}
@media(max-width:980px){.why-panel{grid-template-columns:1fr}}

/* ---------- PRICING (FTMO TABLE) ---------- */
#pricing{position:relative;overflow:hidden}
#pricing::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:640px;height:420px;background:radial-gradient(50% 60% at 50% 0%,rgba(59,130,246,.34),rgba(11,132,254,.1) 55%,transparent 75%);pointer-events:none}
#pricing .wrap{position:relative;z-index:1}
.pr-head{text-align:center;margin-bottom:30px}
.pr-head h2{font-size:clamp(1.9rem,4vw,2.7rem)}
.pr-head p{color:var(--mut);margin-top:10px;font-size:.93rem}
.seg{display:inline-flex;background:rgba(23,23,28,.85);border:1px solid var(--line2);border-radius:16px;padding:6px;gap:6px;margin-top:26px;backdrop-filter:blur(6px)}
.seg button{padding:10px 18px;border-radius:11px;font-size:.88rem;font-weight:700;color:#c9c9d2;display:flex;align-items:center;gap:10px;line-height:1.25;transition:.15s;text-align:left}
.seg button .sgt{display:flex;flex-direction:column}
.seg button small{font-weight:500;font-size:.66rem;color:var(--dim)}
.seg button .i{width:17px;height:17px}
.seg button.on{background:#fff;color:#0a0a0b;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.seg button.on small{color:#55555e}
.curbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cur{display:flex;gap:8px;flex-wrap:wrap}
.cur button{font-size:.8rem;font-weight:700;border:1px solid transparent;border-radius:99px;padding:6px 14px 6px 7px;color:var(--mut);display:flex;align-items:center;gap:8px;background:var(--card)}
.cur button .cc{width:22px;height:22px;min-width:22px;border-radius:50%;font-size:.5rem;background:var(--card3)}
.cur button.on{background:#26262d;color:#fff;border-color:#3d3d46}
.cur button.more{padding:6px 14px}
.usdnote{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--mut)}
.usdnote .cc{width:22px;height:22px;min-width:22px;border-radius:50%;font-size:.5rem}
.viewctl{display:flex;align-items:center;gap:18px;font-size:.8rem;color:var(--mut);font-weight:600}
.tglrow{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.tgl{width:38px;height:21px;border-radius:99px;background:#33333b;position:relative;transition:.2s;flex:none}
.tgl::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tglrow.on .tgl{background:var(--blue)}
.tglrow.on .tgl::after{left:19px}
.eyebtn{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding-left:18px;border-left:1px solid var(--line2)}
.eyebtn.on{color:#fff}
.ptable{display:grid;grid-template-columns:186px repeat(5,1fr);gap:0;align-items:stretch}
.pcol{border:1px solid var(--line);background:var(--card);padding:18px 14px;display:flex;flex-direction:column;position:relative;margin-left:-1px;border-radius:0}
.plabels+.pcol{border-radius:14px 0 0 14px}
.pcol:last-child{border-radius:0 14px 14px 0}
.pcol.best{border-color:#4a361c;background:linear-gradient(180deg,#1d1712 0%,#141419 30%);z-index:2;box-shadow:inset 0 1px 0 rgba(255,157,61,.15)}
.best-tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(100deg,#ff9d2b,#ff6a2b);color:#fff;font-size:.66rem;font-weight:800;padding:5px 13px;border-radius:99px;letter-spacing:.03em;white-space:nowrap;box-shadow:0 4px 14px rgba(255,120,40,.4)}
.plabels{padding:18px 0;display:flex;flex-direction:column}
.plabels .lb-h{height:92px}
.plbl{height:42px;display:flex;align-items:center;gap:9px;font-size:.8rem;color:#c9c9d2;font-weight:600}
.plbl .i{width:15px;height:15px;color:var(--dim)}
.plbl u{text-decoration:none;border-bottom:1px dotted #4a4a52;padding-bottom:2px}
.fee-note{margin-top:auto;padding-top:24px;font-size:.78rem;color:var(--mut);max-width:150px;line-height:1.45}
.pcol .acct{text-align:center;height:92px}
.pcol .acct small{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pcol .acct b{display:block;font-family:"Plus Jakarta Sans";font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.pv{height:42px;display:flex;align-items:center;justify-content:center;font-size:.84rem;text-align:center;color:#e2e2e8}
.pv .y{background:rgba(29,185,84,.14);color:#39d573;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:6px}
.pv.two{flex-direction:column;justify-content:center;line-height:1.35;gap:0}
.pv.two .phr{display:flex;gap:8px;align-items:baseline;font-size:.78rem}
.pv.two .phr small{font-size:.6rem;color:var(--dim);font-weight:700;letter-spacing:.05em;min-width:48px;text-align:left}
.pcol .price{text-align:center;padding:14px 0 2px;font-family:"Plus Jakarta Sans";border-top:1px solid #232329;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.pcol .price s{color:var(--dim);font-size:.84rem;font-weight:600}
.pcol .price b{font-size:1.4rem;font-weight:800}
.pcol.best .price b{color:#ff9d3d}
.pcol.best .price .i{color:#ff9d3d;width:15px;height:15px}
.pcol .btn{margin-top:12px;width:100%}
.avg{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;text-align:center;padding:10px 6px;font-size:.72rem;color:var(--mut)}
.avg b{display:inline-block;background:#26262d;border-radius:6px;padding:2px 10px;color:var(--txt);font-size:.86rem;font-weight:700;margin-bottom:5px}
.avg span{display:block}
.paccess{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px;align-items:center;font-size:.8rem;color:var(--mut)}
.pchip{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 13px;font-size:.76rem;color:#c9c9d2;display:flex;gap:7px;align-items:center}
/* ---------- A-BOOK ---------- */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ab-col{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px}
.ab-col.eze{border-color:rgba(11,132,254,.5);background:linear-gradient(170deg,#111826,#131316 55%)}
.ab-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:4px 9px;margin-bottom:12px}
.ab-col:not(.eze) .ab-tag{background:rgba(242,54,69,.13);color:#ff7a86}
.ab-col.eze .ab-tag{background:rgba(11,132,254,.15);color:#5eaeff}
.ab-col h3{font-size:1.2rem;margin-bottom:4px}
.ab-col .s{color:var(--mut);font-size:.85rem;margin-bottom:18px}
.ab-r{display:flex;gap:11px;padding:11px 0;border-top:1px solid #222228;font-size:.87rem;align-items:flex-start}
.ab-r i{font-style:normal;flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:.62rem;font-weight:700;margin-top:1px}
.ab-col:not(.eze) .ab-r i{background:rgba(242,54,69,.13);color:#ff7a86}
.ab-col.eze .ab-r i{background:rgba(29,185,84,.14);color:#39d573}
.ab-r span{color:#cfcfd8}
.ab-note{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--mut)}
.ab-note b{color:var(--txt)}


/* ---------- PAYOUT PROOF ---------- */
.pp{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;position:relative;padding-top:clamp(8px,2vw,24px)}
.pp-amt{font-family:"Plus Jakarta Sans";font-weight:800;font-size:clamp(3.4rem,8vw,5.6rem);letter-spacing:-.04em;line-height:1}
.pp-amt span{background:linear-gradient(120deg,#39d573,#0b84fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.pp-sub{color:var(--mut);font-size:.95rem;margin-top:14px;line-height:1.7}
.pp-mini{display:flex;gap:38px;margin-top:26px;flex-wrap:wrap}
.pp-mini b{font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.pp-mini i{font-style:normal;color:#5eaeff;font-size:.9rem;font-weight:800;vertical-align:top}
.pp-mini span{display:block;font-size:.6rem;color:var(--dim);letter-spacing:.12em;font-weight:700;margin-top:4px}
.pp-vis{position:relative;min-height:340px}
#globeCv{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:430px;height:430px}

.pay-mq{overflow:hidden;margin-top:clamp(44px,6vw,72px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.pay-track{display:flex;gap:12px;width:max-content;animation:paymq 46s linear infinite}
.pay-mq:hover .pay-track{animation-play-state:paused}
@keyframes paymq{to{transform:translateX(-50%)}}
.pay-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 0;min-width:196px;display:flex;flex-direction:column;gap:5px}
.pay-chip{align-self:flex-start;background:rgba(29,185,84,.15);color:#39d573;border:1px solid rgba(29,185,84,.3);font-size:.58rem;font-weight:800;letter-spacing:.1em;border-radius:6px;padding:3px 8px}
.pay-c b{font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.pay-c em{font-style:normal;font-size:.68rem;color:var(--mut);display:flex;gap:5px;align-items:center;padding-bottom:11px}
.pay-who{display:flex;gap:8px;align-items:center;font-size:.74rem;font-weight:700;color:#c9c9d2;border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px}
@media(max-width:900px){.pp{grid-template-columns:1fr}.pp-vis{display:none}}
/* ---------- STATS STRIP ---------- */
.stats{display:flex;justify-content:center;gap:0;flex-wrap:wrap;text-align:center}
.stats>div{padding:0 34px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats b{font-family:"Plus Jakarta Sans";font-size:1.6rem;font-weight:800;display:block}
.stats span{font-size:.8rem;color:var(--mut)}

/* ---------- VIDEO TESTIMONIALS ---------- */
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.18s}
.vid:hover{border-color:var(--line2);transform:translateY(-2px)}
.thumb{aspect-ratio:16/10.6;position:relative;display:grid;place-items:center}
.thumb .yt{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);border-radius:6px;font-size:.66rem;padding:4px 8px;display:flex;gap:5px;align-items:center;color:#e6e6ec}
.thumb .yt i{font-style:normal;color:#ff0000;font-size:.72rem}
.thumb .pl{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;transition:.18s}
.vid:hover .pl{background:var(--blue);border-color:var(--blue)}
.thumb .pl::after{content:"";border-left:12px solid #fff;border-block:7px solid transparent;margin-left:3px}
.vmeta{padding:14px 16px 6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.vrow{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:10px}
.vrow>div{padding:11px 16px}
.vrow>div+div{border-left:1px solid var(--line)}
.vrow small{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600}
.vrow b{font-size:.86rem;font-weight:700}
.vloc{font-size:.74rem;color:var(--mut);font-weight:400;padding:0 16px}

/* ---------- TRUSTPILOT WALL ---------- */
.tp-head{text-align:center;margin-bottom:26px}
.tp-head .big{display:flex;justify-content:center;align-items:center;gap:10px;font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.5rem}
.tp-head p{color:var(--mut);font-size:.86rem;margin-top:8px}
.tp-head p a{text-decoration:underline}
.showing{font-size:.74rem;color:var(--dim);margin-bottom:12px}
.rvs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rv-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rv-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rv-st{display:flex;gap:2px}
.rv-st i{width:15px;height:15px;background:var(--tp);display:grid;place-items:center;font-style:normal;font-size:.55rem;color:#fff}
.rv-st i.off{background:#3a3a42}
.rv-vf{font-size:.66rem;color:var(--mut);display:flex;align-items:center;gap:4px}.rv-vf .i{color:var(--tp)}

.rv-who{font-size:.72rem;color:var(--dim);margin-bottom:5px}
.rv-who b{color:var(--mut);font-weight:600}
.rv-c h4{font-size:.86rem;font-weight:700;margin-bottom:5px;font-family:Inter}
.rv-c p{font-size:.78rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rv-more{color:var(--tp);font-size:.74rem;font-weight:600;margin-top:7px;display:inline-block}
.tp-cta{display:flex;justify-content:center;margin-top:22px}

/* ---------- TRI CARDS ---------- */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tri-c{border-radius:var(--r-lg);padding:30px 26px;min-height:360px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tri-c.blu{background:linear-gradient(165deg,#0b6ef5,#083ea8)}
.tri-c.grn{background:linear-gradient(165deg,#16a34a,#0b652f)}
.tri-c.org{background:linear-gradient(165deg,#f59e0b,#c2410c)}
.tri-c small{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.82;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.tri-c small i{font-style:normal;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:.6rem}
.tri-c h3{font-size:1.45rem;font-weight:800;margin-bottom:8px}
.tri-c>p{font-size:.87rem;opacity:.92;max-width:32ch}
.tri-list{margin-top:auto;display:grid;gap:7px}
.tri-list div{background:rgba(0,0,0,.28);border-radius:9px;padding:10px 13px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:9px}
.tri-list div i{font-style:normal;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:.58rem;flex:none}
.tri-reward{margin-top:auto;background:rgba(0,0,0,.32);border-radius:12px;padding:16px;text-align:center}
.tri-reward small{justify-content:center;letter-spacing:.06em}
.tri-reward .amt{font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.5rem;color:#a7f3c9}
.tri-reward span{font-size:.7rem;opacity:.8}
.tri-cta{display:flex;gap:12px;justify-content:center;margin-top:26px}

/* ---------- PLATFORMS ---------- */
.plat{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,4vw,60px);align-items:center}
.plat-l h2{font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.14;margin-bottom:14px}
.plat-l p{color:var(--mut);font-size:.93rem;max-width:46ch}
.btn-w{background:#fff;color:#0a0a0b}
.btn-w:hover{background:#e8e8ec}
.plat-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent)}
.pw{aspect-ratio:16/10;border-radius:14px;background:#0c0d11;border:1px solid #1d1e24;display:grid;place-items:center;overflow:hidden}
.pw img{width:100%;height:100%;object-fit:cover}
.pw.ghost{background:#101116;border-color:#17181d}
.wm-dx{font-family:"Plus Jakarta Sans";font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem);color:#3ddc84;letter-spacing:-.02em}
.wm-dx span{color:#e6e6ec}
.wm-mt{display:flex;gap:9px;align-items:center;font-family:"Plus Jakarta Sans";font-weight:800;font-size:clamp(.72rem,1.3vw,.95rem);letter-spacing:.05em;color:#e6e6ec}
.wm-mt svg{width:26px;height:26px}

/* ---------- ACADEMY ---------- */
.acad{border-radius:var(--r-lg);overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;background:var(--card);border:1px solid var(--line)}
.acad-img{min-height:300px;background:
  radial-gradient(70% 90% at 30% 40%,rgba(11,132,254,.4),transparent 60%),
  linear-gradient(140deg,#141a26,#101014);position:relative}
.acad-img::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent 0 46px,rgba(255,255,255,.024) 46px 47px),
  repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.024) 46px 47px)}
.acad-tx{padding:clamp(24px,3.5vw,44px)}
.acad-tx .ktag{font-size:.72rem;color:var(--mut);display:flex;gap:7px;align-items:center;margin-bottom:12px;font-weight:600}
.acad-tx h2{font-size:clamp(1.4rem,2.6vw,1.9rem);margin-bottom:10px}
.acad-tx>p{color:var(--mut);font-size:.9rem;margin-bottom:18px}
.acad-li{display:grid;gap:9px;margin-bottom:22px}
.acad-li div{display:flex;gap:9px;font-size:.86rem;color:#cfcfd8;align-items:center}
.acad-li i{font-style:normal;width:17px;height:17px;border-radius:50%;background:rgba(11,132,254,.16);color:#5eaeff;display:grid;place-items:center;font-size:.58rem;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.duo-c{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.duo-v{min-height:190px;display:grid;place-items:center;position:relative;overflow:hidden}
.duo-v.dis{background:radial-gradient(120% 160% at 15% 0%,#6b78ff 0%,#5865F2 40%,#3b45c4 100%)}
.duo-v.dis::before,.duo-v.dis::after{content:"+";position:absolute;color:rgba(255,255,255,.35);font-size:1.4rem;font-weight:300}
.duo-v.dis::before{top:18px;left:8%}
.duo-v.dis::after{bottom:22px;right:10%;font-size:1rem}
.duo-v.dis .dot{position:absolute;width:5px;height:5px;border-radius:2px;background:rgba(255,255,255,.3)}
.duo-v.yt{background:radial-gradient(90% 130% at 50% 50%,#3d0a0f 0%,#17090b 55%,#0d0a0a 100%)}
.duo-v.yt::before{content:"";position:absolute;inset:-40%;background:radial-gradient(45% 45% at 50% 50%,rgba(255,0,0,.22),transparent 70%)}
.brand-lock{position:relative;z-index:2;display:flex;align-items:center;gap:16px}
.brand-lock .bmk{width:64px;height:64px;display:grid;place-items:center}
.brand-lock .bmk svg{width:60px;height:60px;color:#fff}
.brand-lock .bword{font-family:"Plus Jakarta Sans";font-weight:800;font-size:2.2rem;letter-spacing:-.02em;color:#fff}
.brand-lock .ytmk{width:74px;height:52px;background:#ff0000;border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 30px rgba(255,0,0,.35)}
.brand-lock .ytmk span{border-left:20px solid #fff;border-block:12px solid transparent;margin-left:5px}
.duo-b{padding:20px}
.duo-b small{font-size:.72rem;color:var(--mut);font-weight:600}
.duo-b h3{font-size:1.15rem;margin:6px 0 6px}
.duo-b p{font-size:.84rem;color:var(--mut);margin-bottom:16px}
.dchat{background:rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;font-size:.7rem;display:grid;gap:6px;min-width:210px}
.dchat span{display:flex;gap:7px;align-items:center;color:#dfe1ff}
.dchat i{font-style:normal;opacity:.7}

/* ---------- SUPPORT ---------- */
.sup{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,54px);align-items:center}
.sup .avail{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--mut);font-weight:600;margin-bottom:12px}
.sup .avail i{width:8px;height:8px;border-radius:50%;background:var(--green);font-style:normal}
.sup h2{margin-bottom:12px}
.sup p{color:var(--mut);font-size:.9rem;max-width:46ch}
.sup-btns{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.sup-info{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);max-width:420px}
.sup-info div{padding:14px 18px}
.sup-info div+div{border-left:1px solid var(--line)}
.sup-info small{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:block}
.sup-info b{font-size:.86rem;font-weight:600}
.sup-vis{border-radius:var(--r-lg);border:1px solid var(--line);min-height:330px;position:relative;overflow:hidden;background:
  radial-gradient(80% 100% at 80% 100%,rgba(11,132,254,.34),transparent 60%),linear-gradient(150deg,#15151a,#0e0e12)}
.sup-nums{position:absolute;left:22px;bottom:22px;display:flex;gap:34px}
.sup-nums b{font-family:"Plus Jakarta Sans";font-size:1.9rem;font-weight:800;display:block;line-height:1.1}
.sup-nums span{font-size:.74rem;color:var(--mut)}

/* ---------- FAQ ---------- */
.faq-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.faq-tabs button{font-size:.8rem;font-weight:700;border:1px solid var(--line2);border-radius:99px;padding:8px 16px;color:var(--mut);transition:.15s}
.faq-tabs button.on{background:#fff;color:#0a0a0b;border-color:#fff}
.faq{max-width:820px;margin:0 auto;display:grid;gap:10px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.18s}
.faq details:hover{border-color:var(--line2)}
.faq details[open]{border-color:rgba(11,132,254,.45);background:#121419;box-shadow:0 0 0 1px rgba(11,132,254,.15)}
.faq details.hid{display:none}
.faq summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:18px 20px;font-weight:700;font-size:.95rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.85rem;color:var(--mut);flex:none;transition:.22s;margin-left:auto;order:2}
.faq details[open] summary i{transform:rotate(45deg);color:#fff;border-color:var(--blue);background:var(--blue)}
.faq .fa{padding:0 56px 18px 20px;color:var(--mut);font-size:.88rem;line-height:1.65;animation:faIn .25s ease}
@keyframes faIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.faq-cta{max-width:820px;margin:22px auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.faq-cta b{display:block;font-family:"Plus Jakarta Sans";font-size:1.05rem;font-weight:800}
.faq-cta span{font-size:.82rem;color:var(--mut)}
.faq-cta .btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- BIG CTA ---------- */
.cta{border-radius:var(--r-lg);background:linear-gradient(115deg,#0b6ef5 30%,#0a84ff 70%,#0668d4);padding:clamp(30px,4.5vw,52px);display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;overflow:hidden;position:relative}
.cta h2{font-size:clamp(1.6rem,3.3vw,2.4rem);margin-bottom:16px}
.cta-li{display:grid;gap:9px;margin-bottom:24px}
.cta-li div{display:flex;gap:9px;font-size:.9rem;font-weight:500;align-items:center}
.cta-li i{font-style:normal;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;font-size:.6rem;flex:none}
.cta .btns{display:flex;gap:10px;flex-wrap:wrap}
.cta-mock{background:#0d0d11;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);font-size:.74rem}
.cm-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:11px;border-bottom:1px solid #222228;margin-bottom:12px}
.cm-top b{font-weight:700;font-size:.8rem}
.cm-live{color:#39d573;font-size:.66rem;font-weight:700;display:flex;gap:5px;align-items:center}
.cm-live::before{content:"";width:6px;height:6px;border-radius:50%;background:#39d573}
.cm-eq{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.cm-eq b{font-family:"Plus Jakarta Sans";font-size:1.35rem;font-weight:800}
.cm-eq span{color:#39d573;font-weight:700;font-size:.76rem}
.cm-g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.cm-g div{background:#15151a;border:1px solid #222228;border-radius:8px;padding:8px 9px}
.cm-g small{display:block;font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.cm-g b{font-size:.76rem;font-weight:700}
.trustbar{display:grid;grid-template-columns:1.2fr repeat(3,auto);gap:clamp(18px,4vw,54px);align-items:center;padding-top:44px}
.trustbar h3{font-size:1.05rem;margin-bottom:4px}
.trustbar .mut{font-size:.84rem}
.trustbar .tb-n b{font-family:"Plus Jakarta Sans";font-size:1.45rem;font-weight:800;display:block}
.trustbar .tb-n span{font-size:.76rem;color:var(--mut)}

/* ---------- FOOTER ---------- */
footer{background:var(--bg2);border-top:1px solid var(--line);margin-top:clamp(56px,8vw,104px)}
.ft-g{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:30px;padding:clamp(40px,5vw,64px) 0 36px}
.ft-g h4{font-size:.78rem;font-weight:700;margin-bottom:14px;font-family:Inter}
.ft-g h4 .dot-on{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:1px}
.ft-g ul{list-style:none;display:grid;gap:9px}
.ft-g a{font-size:.82rem;color:var(--mut)}
.ft-g a:hover{color:var(--txt)}
.ft-about p{font-size:.82rem;color:var(--mut);margin:12px 0 16px;max-width:30ch}
.ft-soc{display:flex;gap:8px}
.ft-soc a{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.72rem;color:var(--mut)}
.ft-soc a:hover{border-color:var(--line2);color:var(--txt)}
.ft-addr{font-size:.78rem;color:var(--dim);line-height:1.7}
.news{border-top:1px solid var(--line);padding:26px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.news h3{font-size:1rem}
.news .nf{margin-left:auto;display:flex;gap:8px}
.news input{background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:10px 16px;color:var(--txt);font-size:.84rem;min-width:230px;outline:none}
.news input:focus{border-color:var(--blue)}
.news-ck{display:flex;gap:16px;font-size:.74rem;color:var(--mut);flex-basis:100%}
.disc{border-top:1px solid var(--line);padding:22px 0;font-size:.7rem;color:var(--dim);line-height:1.7}
.ft-bot{border-top:1px solid var(--line);padding:18px 0 30px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--dim)}
.ft-bot .lnks{display:flex;gap:16px}
.ft-bot a:hover{color:var(--txt)}
.pay{display:flex;gap:6px;margin-left:auto}
.pay span{background:var(--card);border:1px solid var(--line);border-radius:5px;font-size:.6rem;padding:4px 8px;color:var(--mut);font-weight:600}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1060px){
  .nv-l{display:none}.nv-r{display:none}.burger{display:grid}
  .ptable{grid-template-columns:repeat(2,1fr);gap:10px}
  .plabels{display:none}
  .pcol{margin-left:0;border-radius:var(--r);padding-top:24px}
  .pv{justify-content:space-between;padding:0 2px}
  .pv::before{content:attr(data-l);color:var(--dim);font-size:.72rem}
  .vids,.rvs{grid-template-columns:repeat(2,1fr)}
  .tri{grid-template-columns:1fr}
  .tri-c{min-height:0}
  .feat4{grid-template-columns:repeat(2,1fr)}
  .cta{grid-template-columns:1fr}
  .trustbar{grid-template-columns:1fr 1fr;gap:18px}
  .ft-g{grid-template-columns:repeat(3,1fr)}
  .acad{grid-template-columns:1fr}.acad-img{min-height:200px}
  .plat,.sup{grid-template-columns:1fr}
  .banner{flex-direction:column;align-items:stretch}
}
@media(max-width:640px){
  .ptable,.vids,.rvs,.feat4,.duo,.faq,.plat-g,.sup-info{grid-template-columns:1fr}
  .stats>div{border-right:0;padding:8px 0;flex-basis:50%}
  .hero-badges{gap:12px;flex-direction:column;align-items:center}
  .news .nf{margin-left:0;flex-wrap:wrap}
  .ft-g{grid-template-columns:1fr 1fr}
}

/* ---------- PHOTOS ---------- */
.ph{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;filter:saturate(.92) contrast(1.02)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
.thumb .yt,.thumb .pl{z-index:2}
.acad-img .ph,.sup-vis .ph{position:absolute;inset:0}
.acad-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,transparent 55%,var(--card))}
.sup-vis::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.72) 10%,rgba(0,0,0,.18) 55%)}
.sup-vis .sup-nums{z-index:2}

/* ---------- HOW IT WORKS ---------- */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.how-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.how-im{height:130px;position:relative}
.how-im::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--card),transparent 70%)}
.how-n{position:absolute;top:10px;left:10px;z-index:2;background:var(--blue);color:#fff;font-size:.66rem;font-weight:800;border-radius:7px;padding:5px 11px;letter-spacing:.06em;box-shadow:0 4px 14px rgba(11,132,254,.45)}
.how-b{padding:18px 18px 20px}
.how-b h3{font-size:.98rem;margin-bottom:6px}
.how-b p{font-size:.82rem;color:var(--mut)}
.how-b .tm{display:inline-block;margin-top:12px;font-size:.66rem;font-weight:700;color:#39d573;background:rgba(29,185,84,.12);border-radius:99px;padding:4px 10px}

/* ---------- INSTRUMENTS ---------- */
.itabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.itabs button{font-size:.8rem;font-weight:600;border:1px solid var(--line2);border-radius:99px;padding:8px 16px;color:var(--mut);transition:.15s}
.itabs button.on{background:#fff;color:#0a0a0b;border-color:#fff}
.itbl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.itbl .iname{display:flex;align-items:center;gap:11px}
.itbl .iname div b{display:block;font-size:.88rem;color:var(--txt)}
.itbl .iname div small{font-size:.66rem;color:var(--dim)}
.itbl .px{font-family:"Plus Jakarta Sans";font-weight:700;color:var(--txt);font-size:.88rem}
.itbl .chg{font-weight:700;font-size:.8rem}
.itbl .chg.up{color:#39d573}.itbl .chg.dn{color:#ff6673}
.itbl .spark.up polyline{stroke:#39d573}.itbl .spark.up .fillp{fill:#39d573}.inote{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:.76rem;color:var(--mut)}
.inote b{color:var(--txt)}
.inote .sep{width:4px;height:4px;border-radius:50%;background:#3a3a42}
.itbl table{width:100%;border-collapse:collapse;font-size:.85rem}
.itbl th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700;text-align:left;padding:13px 18px;background:var(--card2);border-bottom:1px solid var(--line)}
.itbl td{padding:13px 18px;border-bottom:1px solid #1e1e24;color:var(--mut)}
.itbl tr:last-child td{border-bottom:0}
.itbl td:first-child{color:var(--txt);font-weight:600}
.itbl tr:hover td{background:#17171c}
.sym{display:inline-grid;place-items:center;min-width:34px;padding:0 5px;height:34px;border-radius:9px;font-size:.62rem;font-weight:800;flex:none}
.iscroll{overflow-x:auto}

/* ---------- LEADERBOARD ---------- */
.lb{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.lb-r{display:grid;grid-template-columns:54px 1.4fr 1fr 1fr 1fr;align-items:center;padding:13px 18px;border-bottom:1px solid #1e1e24;font-size:.86rem}
.lb-r:last-child{border-bottom:0}
.lb-r.h{background:var(--card2);font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700;padding:11px 18px}
.lb-r:not(.h):hover{background:#17171c}
.lb-rank{font-family:"Plus Jakarta Sans";font-weight:800;color:var(--dim)}
.lb-r:nth-child(2) .lb-rank,.lb-r:nth-child(3) .lb-rank,.lb-r:nth-child(4) .lb-rank{color:#ffb04d}
.lb-who{display:flex;align-items:center;gap:10px;font-weight:600}
.lb-av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.lb-num{text-align:right;color:var(--mut)}
.lb-num.g{color:#39d573;font-weight:600}
.lb-num.gold{color:#ffb04d;font-weight:700}

/* ---------- PAYOUT METHODS ---------- */
.wd{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.wd-c{border-radius:var(--r-lg);padding:34px 26px 28px;min-height:440px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.wd-c::before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:300px;height:170px;background:radial-gradient(55% 100% at 50% 0%,rgba(255,255,255,.2),transparent 75%);pointer-events:none}
.wd-c.blu{background:linear-gradient(180deg,#0ea5b7 0%,#0a4a5c 100%)}
.wd-c.grn{background:linear-gradient(180deg,#8b5cf6 0%,#3b1a78 100%)}
.wd-c.org{background:linear-gradient(180deg,#2fae5e 0%,#0b5c2c 100%)}
.wd-ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:14px;position:relative;z-index:1}
.wd-c.blu .wd-ic{color:#0b8a9c}.wd-c.grn .wd-ic{color:#7443e0}.wd-c.org .wd-ic{color:#1d8a4a}
.wd-c small{font-size:.64rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:8px;position:relative;z-index:1}
.wd-c h3{font-size:1.5rem;font-weight:800;line-height:1.18;margin-bottom:10px;position:relative;z-index:1}
.wd-c>p{font-size:.86rem;opacity:.94;max-width:34ch;position:relative;z-index:1}
.wd-list{margin-top:auto;display:grid;gap:8px;width:100%;position:relative;z-index:1}
.wd-list div{background:rgba(0,0,0,.3);border-radius:10px;padding:11px 14px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:10px;text-align:left}
.wd-list div i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:.62rem;font-weight:800;flex:none}
.wd-list div b{margin-left:auto;font-size:.72rem;font-weight:800;color:#fff;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center}
.wd-arrow{position:absolute;top:44%;z-index:3;width:42px;height:42px;border-radius:50%;background:#141419;border:1px solid var(--line2);display:grid;place-items:center;color:#c9c9d2;box-shadow:0 6px 18px rgba(0,0,0,.5)}
/* certificate */
.cert-stack{margin-top:auto;width:100%;position:relative;z-index:1;padding-top:10px}
.cert-stack::before,.cert-stack::after{content:"";position:absolute;left:8%;right:8%;height:60px;background:#0c1210;border-radius:12px;opacity:.65}
.cert-stack::before{top:-2px;transform:rotate(-2.2deg)}
.cert-stack::after{top:2px;transform:rotate(1.6deg);opacity:.45}
.cert{position:relative;background:linear-gradient(160deg,#101614,#0a0e0c);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:16px 18px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cert-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.cert-brand{display:inline-flex;gap:6px;align-items:center;font-family:"Plus Jakarta Sans";font-weight:800;font-size:.8rem;color:#fff}
.cert-brand .i{color:#5eaeff}
.cert-t{font-family:"Plus Jakarta Sans";font-weight:800;letter-spacing:.2em;font-size:.72rem;color:#e6e6ec;margin-left:auto}
.cert-to{font-size:.62rem;color:#8a8f98}
.cert-name{font-size:.88rem;font-weight:700;color:#ffd479;margin:2px 0 10px}
.cert-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cert-lbl{font-size:.6rem;color:#8a8f98}
.cert-amt{font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.45rem;color:#4be08a;letter-spacing:-.01em}
.cert-qr{width:44px;height:44px;fill:#e6e6ec;flex:none;background:#fff;padding:4px;border-radius:6px}
.cert-qr rect{fill:#111}.cert-qr .q0{fill:#fff}
.cert-f{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.12);font-size:.68rem;color:#d6d6de}
.cert-f em{display:block;font-style:normal;font-size:.56rem;color:#8a8f98;margin-top:2px}
.cert-f .sig{font-family:Georgia,serif;font-style:italic}
@media(max-width:1060px){.wd{grid-template-columns:1fr}.wd-arrow{display:none}.wd-c{min-height:0}}
/* ---------- TEAM ---------- */
.team-panel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(90% 120% at 85% 10%,#141b2b 0%,#101014 45%,#0f0f12 100%);display:grid;grid-template-columns:1.05fr 1fr;gap:24px;padding:clamp(28px,4vw,52px)}
.team-panel::before{content:"";position:absolute;right:-120px;bottom:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(11,132,254,.16),transparent 65%)}
.tp-tag{display:inline-flex;gap:7px;align-items:center;font-size:.66rem;font-weight:800;letter-spacing:.12em;color:#5eaeff;background:rgba(11,132,254,.1);border:1px solid rgba(11,132,254,.25);border-radius:99px;padding:6px 12px;margin-bottom:16px}
.tp-l h2{margin-bottom:12px}
.tp-l p{color:var(--mut);font-size:.92rem;max-width:50ch;margin-bottom:22px}
.tp-l .btns{display:flex;gap:10px}
.tmosaic{position:relative;min-height:300px}
.tav{position:absolute;border-radius:50%;object-fit:cover;border:2px solid #2f2f38;outline:3px solid rgba(255,255,255,.04);box-shadow:0 10px 26px rgba(0,0,0,.5);animation:tfloat 6s ease-in-out infinite;image-rendering:auto}
@keyframes tfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tmore{position:absolute;right:6%;bottom:4%;background:var(--card3);border:1px solid var(--line2);border-radius:99px;padding:7px 14px;font-size:.72rem;font-weight:700;color:#c9c9d2}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.ts{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;align-items:center;gap:14px}
.tsi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ts b{font-family:"Plus Jakarta Sans";font-size:1.55rem;font-weight:800;display:block;line-height:1.1}
.ts span{font-size:.76rem;color:var(--mut)}
@media(max-width:900px){.team-panel{grid-template-columns:1fr}.tmosaic{min-height:240px}}
/* ---------- BLOG ---------- */
.blog{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bl{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.bl:hover{border-color:var(--line2);transform:translateY(-2px)}
.bl-im{height:168px;position:relative}
.bl-im .cat{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.66);border:1px solid var(--line2);font-size:.62rem;font-weight:700;padding:4px 10px;border-radius:99px;color:#e6e6ec;letter-spacing:.04em}
.bl-b{padding:18px;display:flex;flex-direction:column;flex:1}
.bl-b h3{font-size:1rem;margin-bottom:7px}
.bl-b p{font-size:.82rem;color:var(--mut)}
.bl-b .mt{margin-top:auto;padding-top:14px;font-size:.7rem;color:var(--dim);display:flex;gap:8px;align-items:center}
.bl-b .mt img{width:22px;height:22px;border-radius:50%;object-fit:cover}

/* ---------- AFFILIATE ---------- */
.aff{border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(115deg,#141420,#101018);padding:clamp(24px,3.5vw,40px);display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.aff::before{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(11,132,254,.22),transparent 65%)}
.aff h2{font-size:clamp(1.3rem,2.6vw,1.8rem);margin-bottom:6px}
.aff p{color:var(--mut);font-size:.88rem;max-width:48ch}
.aff .nums{display:flex;gap:28px;margin-left:auto}
.aff .nums b{font-family:"Plus Jakarta Sans";font-size:1.5rem;font-weight:800;display:block}
.aff .nums span{font-size:.72rem;color:var(--mut)}

@media(max-width:1060px){
  .how{grid-template-columns:repeat(2,1fr)}
  .pm-g{grid-template-columns:repeat(2,1fr)}
  .tstats{grid-template-columns:1fr}
  .blog{grid-template-columns:1fr}
  .lb-r{grid-template-columns:40px 1.4fr 1fr 1fr}
  .lb-r>.hidem{display:none}
  .aff .nums{margin-left:0}
}
@media(max-width:640px){
  .how,.pm-g{grid-template-columns:1fr}
  .lb-r{grid-template-columns:36px 1.5fr 1fr;font-size:.78rem;padding:11px 12px}
  .lb-r>.hides{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation:none!important}
  html{scroll-behavior:auto}
}

.nv-l a.on{color:#fff}.nv-l a.on::after{content:"";display:block;height:2px;background:var(--blue);border-radius:2px;margin-top:5px}
nav.scrolled{background:rgba(10,10,11,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.burger.on span{background:transparent}.burger.on span::before{transform:translateY(0) rotate(45deg)}.burger.on span::after{transform:translateY(0) rotate(-45deg)}

/* ---------- PAGE SYSTEM (non-landing pages) ---------- */
.page-hero{position:relative;overflow:hidden;text-align:center;padding:clamp(64px,9vw,120px) 0 clamp(40px,5vw,72px);border-bottom:1px solid var(--line)}
.page-hero::before{content:"";position:absolute;inset:0;background:var(--ph-glow,radial-gradient(60% 80% at 50% -10%,rgba(11,132,254,.22),transparent 70%));pointer-events:none}
.page-hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.4px);background-size:24px 24px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%);pointer-events:none;opacity:.7}
.page-hero .wrap{position:relative;z-index:1}
.crumb{display:inline-flex;gap:8px;align-items:center;font-size:.76rem;color:var(--dim);margin-bottom:20px}
.crumb a{color:var(--mut)}.crumb a:hover{color:#fff}
.crumb svg{width:12px;height:12px;opacity:.5}
.page-hero .peye{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.24em;color:var(--ph-ac,#5eaeff);margin-bottom:16px}
.page-hero h1{font-size:clamp(2.2rem,5.4vw,3.8rem);line-height:1.06;max-width:16ch;margin:0 auto;letter-spacing:-.02em}
.page-hero .sub{color:var(--mut);margin:20px auto 30px;max-width:60ch;font-size:1.05rem;line-height:1.6}
.page-hero .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.page-hero .ph-quick{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.ph-quick div{text-align:center}
.ph-quick b{display:block;font-family:"Plus Jakarta Sans";font-weight:800;font-size:1.6rem;letter-spacing:-.01em}
.ph-quick b.grn{color:#39d573}
.ph-quick span{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
/* section eyebrow used across pages */
.sec-eye{display:block;text-align:center;font-size:.7rem;font-weight:800;letter-spacing:.2em;color:var(--mut);margin-bottom:10px}
/* per-page accent themes */
.pg-abook{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(29,185,84,.2),transparent 70%);--ph-ac:#39d573}
.pg-rewards{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(11,132,254,.22),transparent 70%);--ph-ac:#5eaeff}
.pg-academy{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(139,92,246,.2),transparent 70%);--ph-ac:#b58bff}
.pg-about{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(245,158,11,.18),transparent 70%);--ph-ac:#ffb04d}
.pg-challenge{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(11,132,254,.22),transparent 70%);--ph-ac:#5eaeff}
.pg-faq{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(11,132,254,.18),transparent 70%);--ph-ac:#5eaeff}
.pg-reviews{--ph-glow:radial-gradient(60% 80% at 50% -10%,rgba(0,182,122,.2),transparent 70%);--ph-ac:#00b67a}

/* ================= SUBPAGES v2 ================= */
.grad{background:linear-gradient(100deg,#5eaeff,#0b84fe 55%,#39d573);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;gap:8px;align-items:center;font-size:.78rem;font-weight:600;color:var(--mut);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;margin-bottom:18px;background:var(--card)}

/* journey stepper (challenge) */
.jour{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:0;align-items:stretch;margin-top:8px}
.jr{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 22px;position:relative;display:flex;flex-direction:column}
.jr small{font-size:.64rem;font-weight:800;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.jr h3{font-size:1.06rem;margin:8px 0 4px}
.jr>p{font-size:.82rem;color:var(--mut)}
.jr-m{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.jr-m div{font-size:.72rem;color:var(--mut)}
.jr-m b{display:block;font-family:"Plus Jakarta Sans";font-size:1.05rem;font-weight:800;color:var(--txt)}
.jr.done::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg);pointer-events:none;box-shadow:inset 0 0 0 1px rgba(29,185,84,.4)}
.jr.done{background:linear-gradient(165deg,#101a14,#111316 60%)}
.jr.done small{color:#39d573}
.jr-link{width:56px;display:grid;place-items:center;position:relative}
.jr-link::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 7px,transparent 7px 14px);animation:jflow 1.1s linear infinite}
.jr-link span{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--card3);border:1px solid var(--line2);display:grid;place-items:center;color:var(--mut)}
@keyframes jflow{to{background-position:14px 0}}
@media(max-width:900px){.jour{grid-template-columns:1fr}.jr-link{width:auto;height:40px}.jr-link::before{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--line2) 0 7px,transparent 7px 14px);animation:none}}

/* calculator (challenge / academy) */
.calc{display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.calc-l{padding:clamp(22px,3vw,34px);display:grid;gap:20px;align-content:start}
.calc-f small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-size:.8rem;font-weight:700;border:1px solid var(--line2);border-radius:99px;padding:7px 14px;color:var(--mut);transition:.15s}
.chips button.on{background:#fff;color:#0a0a0b;border-color:#fff}
.calc input[type=range]{width:100%;accent-color:var(--blue)}
.calc-rv{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-top:6px}
.calc-rv b{color:var(--txt);font-family:"Plus Jakarta Sans"}
.calc-r{background:linear-gradient(165deg,#101826,#0e1014 70%);border-left:1px solid var(--line);padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;justify-content:center}
.calc-r small{font-size:.66rem;font-weight:800;letter-spacing:.14em;color:#5eaeff;text-transform:uppercase}
.calc-out{font-family:"Plus Jakarta Sans";font-weight:800;font-size:clamp(2.2rem,4.5vw,3.2rem);letter-spacing:-.02em;margin:8px 0 4px;color:#39d573}
.calc-r>p{font-size:.8rem;color:var(--mut)}
.calc-rows{margin-top:18px;border-top:1px solid #232329;display:grid}
.calc-rows div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1c1c22;font-size:.82rem;color:var(--mut)}
.calc-rows b{color:var(--txt);font-family:"Plus Jakarta Sans"}
.calc-disc{margin-top:14px;font-size:.68rem;color:var(--dim);line-height:1.6}
@media(max-width:900px){.calc{grid-template-columns:1fr}.calc-r{border-left:0;border-top:1px solid var(--line)}}

/* rulebook rows (challenge) */
.rul{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.rul-r{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid #1e1e24}
.rul-r:last-child{border-bottom:0}
.rul-n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:"Plus Jakarta Sans";font-weight:800;font-size:.8rem}
.rul-r.ok .rul-n{background:rgba(29,185,84,.13);color:#39d573}
.rul-r.no .rul-n{background:rgba(242,54,69,.12);color:#ff7a86}
.rul-r h4{font-size:.9rem;font-weight:700}
.rul-r p{font-size:.78rem;color:var(--mut)}
.rul-tag{font-size:.64rem;font-weight:800;letter-spacing:.06em;border-radius:99px;padding:4px 11px;white-space:nowrap}
.rul-r.ok .rul-tag{background:rgba(29,185,84,.12);color:#39d573}
.rul-r.no .rul-tag{background:rgba(242,54,69,.1);color:#ff7a86}
@media(max-width:640px){.rul-r{grid-template-columns:36px 1fr}.rul-tag{display:none}}

/* routing wire — live order trace (a-book) */
.wire{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.wire-top{display:flex;gap:18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card2);font-size:.72rem;color:var(--mut);flex-wrap:wrap}
.wt-live{display:flex;gap:7px;align-items:center;font-weight:800;letter-spacing:.08em;color:#39d573;font-size:.66rem}
.wt-live i{width:7px;height:7px;border-radius:50%;background:#39d573;font-style:normal;animation:blink 1.6s ease-in-out infinite}
