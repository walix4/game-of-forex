<script>
(function(){
"use strict";

/* ---------- HEADER / NAV (runs on every page) ---------- */
(function(){
  var nav=document.querySelector('nav');
  var burger=document.getElementById('burger'), mm=document.getElementById('mmenu');

  /* mobile menu toggle */
  if(burger&&mm){
    burger.addEventListener('click',function(e){
      e.stopPropagation();
      var open=mm.classList.toggle('open');
      burger.classList.toggle('on',open);
      burger.setAttribute('aria-expanded',open?'true':'false');
      document.body.style.overflow=open?'hidden':'';
    });
    mm.addEventListener('click',function(e){ if(e.target.closest('a')){ mm.classList.remove('open'); burger.classList.remove('on'); burger.setAttribute('aria-expanded','false'); document.body.style.overflow=''; } });
    /* close on outside click / Escape / resize to desktop */
    document.addEventListener('click',function(e){
      if(mm.classList.contains('open') && !e.target.closest('#mmenu') && !e.target.closest('#burger')){
        mm.classList.remove('open'); burger.classList.remove('on'); burger.setAttribute('aria-expanded','false'); document.body.style.overflow='';
      }
    });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&mm.classList.contains('open')){ mm.classList.remove('open'); burger.classList.remove('on'); document.body.style.overflow=''; } });
    window.addEventListener('resize',function(){ if(window.innerWidth>900&&mm.classList.contains('open')){ mm.classList.remove('open'); burger.classList.remove('on'); document.body.style.overflow=''; } });
  }

  /* shrink header on scroll */
  if(nav){
    var onScroll=function(){ nav.classList.toggle('scrolled', window.scrollY>10); };
    onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
  }

  /* auto-active nav: if no link is marked .on, match by current filename */
  if(nav && !nav.querySelector('.nv-l a.on')){
    var here=(location.pathname.split('/').pop()||'index.html').toLowerCase();
    nav.querySelectorAll('.nv-l a[href]').forEach(function(a){
      var href=(a.getAttribute('href')||'').toLowerCase();
      if(href===here || (here==='index.html'&&href==='index.html')) a.classList.add('on');
    });
  }

  /* smooth-scroll only for same-page anchors; let real page links navigate normally */
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#"]'); if(!a) return;
    var id=a.getAttribute('href'); if(id==='#'||id.length<2) return;
    var t=document.querySelector(id); if(!t) return;
    e.preventDefault();
    t.scrollIntoView({behavior:'smooth',block:'start'});
    history.replaceState(null,'',id);
  });
})();

function pv(pct,acct){return showNums? fmt$(Math.round(acct*pct/100)) : pct+'%'}

  var d=D[k];
  var html='<div class="plabels"><div class="lb-h"></div>'+
    LBL.map(function(l){return '<div class="plbl"><svg class="i"><use href="#i-'+l[0]+'"/></svg><u>'+l[1]+'</u></div>'}).join('')+

        '<span class="phr"><small>PHASE 1</small><b>'+pv(d.pt[0],c.a)+'</b></span>'+
        '<span class="phr"><small>PHASE 2</small><b>'+pv(d.pt[1],c.a)+'</b></span></div>';

      (c.best?'<span class="best-tag">Best Value</span>':'')+
      '<div class="acct"><small>Account</small><b>'+fmt$(c.a)+'</b></div>'+
      target+

      '<div class="pv">'+d.rw+'</div>'+
      '<div class="pv"><b style="color:#39d573">Instant</b></div>'+
      '<div class="price">'+(c.best?'<svg class="i"><use href="#i-flame"/></svg>':'')+
        (c.was?'<s>'+fmtP(c.was)+'</s>':'')+'<b>'+fmtP(c.p)+'</b></div>'+

    '</div>';
  });
  document.getElementById('ptable').innerHTML=html;
  document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.k===k)});
  document.getElementById('ptable').dataset.k=k;
}

});

});

});

/* count-up numbers: <b data-count="94213540" data-pre="$" data-suf="+"> */
(function(){
  var els=document.querySelectorAll('[data-count]'); if(!els.length) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function run(el){
    var end=parseInt(el.dataset.count,10), pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    if(reduce){ el.textContent=pre+end.toLocaleString('en-US')+suf; return; }
    var t0=null, dur=1400;
    function step(t){
      if(!t0)t0=t; var p=Math.min(1,(t-t0)/dur); p=1-Math.pow(1-p,3);
      el.textContent=pre+Math.round(end*p).toLocaleString('en-US')+suf;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ run(e.target); io.unobserve(e.target); } })},{rootMargin:'-40px'});
    els.forEach(function(el){io.observe(el)});
  } else els.forEach(run);
})();

(function(){

  var size=100000, split=90;

})();

  var bal=document.getElementById('lotBal'), risk=document.getElementById('lotRisk'), sl=document.getElementById('lotSL');
  function calc(){
    var b=parseFloat(bal.value), r=parseFloat(risk.value), s=parseFloat(sl.value);
    document.getElementById('lotBalV').textContent='$'+b.toLocaleString('en-US');
    document.getElementById('lotRiskV').textContent=r+'%';
    document.getElementById('lotSLV').textContent=s+' pips';
    var riskAmt=b*r/100;
    var lots=riskAmt/(s*10); /* $10 per pip per standard lot (majors) */
    document.getElementById('lotRiskAmt').textContent='$'+Math.round(riskAmt).toLocaleString('en-US');
    out.textContent=(Math.round(lots*100)/100).toFixed(2)+' lots';
  }
  [bal,risk,sl].forEach(function(el){el.addEventListener('input',calc)});
  calc();
})();

/* blog: list <-> readable article detail + category filter */
(function(){
  var side=document.getElementById('bpSide'); if(!side) return;
  var listSec=document.getElementById('bpList'), detSec=document.getElementById('bpDetail');
  var arts=[].slice.call(document.querySelectorAll('.bd-art'));
  var CATL={stories:'Trader Stories',psychology:'Trading Psychology',tips:'Trading Tips',systems:'Trading Systems',live:'Live Trading',news:'Prop Firm News',challenge:'EZE Challenge',community:'Community'};
  function cardHTML(x){
    return '<a class="bp-card" href="#'+x.id+'" data-post="'+x.id+'">'+
      '<span class="bp-th"><img loading="lazy" src="https://i.ytimg.com/vi/'+x.dataset.v+'/hqdefault.jpg" alt=""><span class="pl"><span></span></span></span>'+
      '<div class="bp-meta"><span class="bp-tag">'+CATL[x.dataset.c]+'</span><span class="bp-date">&middot; '+x.dataset.d+'</span></div>'+
      '<h3>'+x.dataset.t+'</h3></a>';
  }
  function showList(){
    listSec.classList.remove('hidsec'); detSec.classList.add('hidsec');
    if(history.replaceState) history.replaceState(null,'',location.pathname+location.search);
  }
  function show(id,scroll){
    var art=document.getElementById(id); if(!art) return;
    arts.forEach(function(x){x.classList.toggle('on',x===art)});
    listSec.classList.add('hidsec'); detSec.classList.remove('hidsec');
    var c=document.getElementById('bdCrumb');
    if(c) c.innerHTML='<button class="cb">All posts</button><svg class="i"><use href="#i-chev"/></svg><span>'+CATL[art.dataset.c]+'</span><svg class="i"><use href="#i-chev"/></svg><b>'+art.dataset.t+'</b>';
    var rel=document.getElementById('bdRel');
    if(rel){
      var pool=arts.filter(function(x){return x!==art&&x.dataset.c===art.dataset.c});
      arts.forEach(function(x){ if(x!==art&&x.dataset.c!==art.dataset.c&&pool.length<3) pool.push(x); });
      rel.innerHTML=pool.slice(0,3).map(cardHTML).join('');
    }
    if(history.replaceState) history.replaceState(null,'','#'+id);
    if(scroll) window.scrollTo({top:0,behavior:'auto'});
  }
  document.addEventListener('click',function(e){
    var p=e.target.closest('[data-post]');
    if(p){ e.preventDefault(); show(p.dataset.post,true); return; }
    if(e.target.closest('#bdCrumb .cb')){ showList(); window.scrollTo({top:0,behavior:'auto'}); }
  });
  side.addEventListener('click',function(e){
    var b=e.target.closest('.bp-cat'); if(!b) return;
    var c=b.dataset.c;
    showList();
    side.querySelectorAll('.bp-cat').forEach(function(x){x.classList.toggle('on',x===b)});
    document.querySelectorAll('#bpList .bp-card[data-c]').forEach(function(card){
      card.classList.toggle('hid', c!=='all' && card.dataset.c!==c);
    });
    ['bpTop','bpPop','bpCta','bpPag'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.classList.toggle('hidsec', c!=='all');
    });
  });
  var h=location.hash.replace('#','');
  if(document.getElementById(h)&&document.getElementById(h).classList.contains('bd-art')) show(h,false);
})();

/* academy: playlist library with embedded player */
(function(){
  var frame=document.getElementById('acFrame'); if(!frame) return;
  var secs=[].slice.call(document.querySelectorAll('.ac-sec'));
  function cardsOf(pid){ return [].slice.call(document.querySelectorAll('.ac-card[data-p="'+pid+'"]')); }
  function secOf(pid){ return document.querySelector('.ac-sec[data-p="'+pid+'"]'); }
  function play(v,pid,auto,scroll){
    var cards=cardsOf(pid), idx=0;
    cards.forEach(function(c,i){ if(c.dataset.v===v) idx=i; });
    frame.src='https://www.youtube-nocookie.com/embed/'+v+'?list='+pid+'&rel=0'+(auto?'&autoplay=1':'');
    var sec=secOf(pid), name=sec?sec.dataset.name:'';
    document.getElementById('acTitle').textContent=cards[idx].dataset.t;
    document.getElementById('acMeta').innerHTML='<span class="bp-tag">'+name+'</span><span class="bp-date">&middot; Lesson '+(idx+1)+' of '+cards.length+'</span>';
    document.getElementById('acPlName').textContent=name;
    document.getElementById('acPlCount').textContent=cards.length+' lessons \u00b7 plays in order';
    var list=document.getElementById('acList');
    list.innerHTML=cards.map(function(c,i){
      return '<button class="ac-l'+(i===idx?' on':'')+'" data-v="'+c.dataset.v+'" data-p="'+pid+'">'+
        '<em>'+('0'+(i+1)).slice(-2)+'</em>'+
        '<span class="lth"><img loading="lazy" src="https://i.ytimg.com/vi/'+c.dataset.v+'/mqdefault.jpg" alt=""><i class="lp"><svg class="i s12"><use href="#i-play"/></svg></i></span>'+
        '<span class="lt">'+c.dataset.t+'</span></button>';
    }).join('');
    var on=list.querySelector('.ac-l.on'); if(on) on.scrollIntoView({block:'nearest'});
    document.querySelectorAll('.ac-card').forEach(function(c){ c.classList.toggle('on',c.dataset.v===v&&c.dataset.p===pid); });
    if(history.replaceState) history.replaceState(null,'','#p-'+v);
    if(scroll) document.getElementById('acPlayer').scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.addEventListener('click',function(e){
    var c=e.target.closest('.ac-card'); if(c){ e.preventDefault(); play(c.dataset.v,c.dataset.p,true,true); return; }
    var l=e.target.closest('.ac-l'); if(l){ play(l.dataset.v,l.dataset.p,true,false); return; }
    var pa=e.target.closest('.playall'); if(pa){ e.preventDefault(); var pid=pa.dataset.p; var cs=cardsOf(pid); if(cs.length) play(cs[0].dataset.v,pid,true,true); }
  });
  /* sidebar: filter playlists */
  var side=document.getElementById('acSide');
  side?.addEventListener('click',function(e){
    var b=e.target.closest('.bp-cat'); if(!b) return;
    var p=b.dataset.p;
    side.querySelectorAll('.bp-cat').forEach(function(x){x.classList.toggle('on',x===b)});
    secs.forEach(function(sc){ sc.classList.toggle('hid', p!=='all' && sc.dataset.p!==p); });
  });
  /* init: deep link or first lesson of first playlist */
  var h=location.hash.replace('#p-','');
  var c0=h?document.querySelector('.ac-card[data-v="'+h+'"]'):null;
  if(!c0) c0=document.querySelector('.ac-card');
  if(c0) play(c0.dataset.v,c0.dataset.p,false,false);
})();

/* about timeline: reveal steps on scroll */
(function(){
  var tl=document.querySelector('.tline'); if(!tl||!('IntersectionObserver' in window)) return;
  tl.classList.add('anim');
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{rootMargin:'-60px 0px'});
  tl.querySelectorAll('.tl').forEach(function(x){io.observe(x)});
})();

/* hero chips proxy clicks to sidebar filters */
document.querySelectorAll('[data-proxy]').forEach(function(b){
  b.addEventListener('click',function(){
    var t=document.querySelector(b.dataset.proxy); if(!t) return;
    t.click();
    var sc=b.dataset.scroll?document.querySelector(b.dataset.scroll):null;
    if(sc) sc.scrollIntoView({behavior:'smooth',block:'start'});
  });
});

/* rating distribution bars animate in (reviews) */
(function(){
  var r=document.querySelector('.rate'); if(!r) return;
  if(!('IntersectionObserver' in window)){ r.classList.add('in'); return; }
  new IntersectionObserver(function(e,io){ if(e[0].isIntersecting){ r.classList.add('in'); io.disconnect(); } },{rootMargin:'-60px'}).observe(r);
})();
})();
</script>
