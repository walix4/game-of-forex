name: Deploy to GitHub Pages

# Publishes the static EZE Funded site in site/.
# The Next.js app is still in this repo but is no longer what Pages serves —
# see git history for the previous npm-build workflow if it needs restoring.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rebuild from pages/ + partials/ so a committed-but-stale dist/ can
      # never ship. build.py has no dependencies.
      - run: python3 build.py
        working-directory: site
      - run: touch site/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
